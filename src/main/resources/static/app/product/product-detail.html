<h2 ng-if="vm.isNew">New Product</h2>
<h2 ng-if="!vm.isNew">Edit Product</h2>

<div class="alert alert-danger" ng-if="vm.error">{{ vm.error }}</div>

<form name="productForm" ng-submit="vm.save()">
    <div class="form-group">
        <label for="sku">SKU</label>
        <input type="text" class="form-control" id="sku" ng-model="vm.product.sku" required>
    </div>
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name" ng-model="vm.product.name" required>
    </div>
    <div class="form-group">
        <label for="description">Description</label>
        <textarea class="form-control" id="description" ng-model="vm.product.description"></textarea>
    </div>
    <div class="form-group">
        <label for="unitPrice">Unit Price</label>
        <input type="number" class="form-control" id="unitPrice" ng-model="vm.product.unitPrice" min="0" step="0.01" required>
    </div>
    <div class="form-group">
        <label for="quantityOnHand">Quantity On Hand</label>
        <input type="number" class="form-control" id="quantityOnHand" ng-model="vm.product.quantityOnHand" min="0" required>
    </div>
    <div class="form-group">
        <label for="reorderThreshold">Reorder Threshold</label>
        <input type="number" class="form-control" id="reorderThreshold" ng-model="vm.product.reorderThreshold" min="0" required>
    </div>
    <button type="submit" class="btn btn-primary" ng-disabled="vm.saving || productForm.$invalid">Save</button>
    <a class="btn btn-default" href="#!/products">Cancel</a>
</form>
