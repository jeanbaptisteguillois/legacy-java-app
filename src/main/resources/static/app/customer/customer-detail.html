<h2 ng-if="vm.isNew">New Customer</h2>
<h2 ng-if="!vm.isNew">Edit Customer</h2>

<div class="alert alert-danger" ng-if="vm.error">{{ vm.error }}</div>

<form name="customerForm" ng-submit="vm.save()">
    <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" class="form-control" id="firstName" ng-model="vm.customer.firstName" required>
    </div>
    <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" class="form-control" id="lastName" ng-model="vm.customer.lastName" required>
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email" ng-model="vm.customer.email" required>
    </div>
    <div class="form-group">
        <label for="phone">Phone</label>
        <input type="text" class="form-control" id="phone" ng-model="vm.customer.phone">
    </div>
    <div class="form-group">
        <label for="shippingAddress">Shipping Address</label>
        <textarea class="form-control" id="shippingAddress" ng-model="vm.customer.shippingAddress"></textarea>
    </div>
    <button type="submit" class="btn btn-primary" ng-disabled="vm.saving || customerForm.$invalid">Save</button>
    <a class="btn btn-default" href="#!/customers">Cancel</a>
</form>
