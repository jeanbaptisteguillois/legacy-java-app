<h2>Customers</h2>

<a class="btn btn-primary" href="#!/customers/new">Add Customer</a>

<div ng-if="vm.loading">Loading customers...</div>
<div class="alert alert-danger" ng-if="vm.error">{{ vm.error }}</div>

<table class="table table-striped" ng-if="!vm.loading">
    <thead>
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Shipping Address</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr ng-repeat="customer in vm.customers">
        <td><a href="#!/customers/{{ customer.id }}">{{ customer.firstName }} {{ customer.lastName }}</a></td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.phone }}</td>
        <td>{{ customer.shippingAddress }}</td>
        <td>
            <button class="btn btn-sm btn-danger" ng-click="vm.deleteCustomer(customer)">Delete</button>
        </td>
    </tr>
    </tbody>
</table>
