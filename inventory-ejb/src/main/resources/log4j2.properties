# Log4j 2 configuration. Replaces the previous Log4j 1.x log4j.properties;
# application code still uses the org.apache.log4j API via the
# log4j-1.2-api bridge (see com.example.inventory.util.LoggingUtil).
status = warn

appender.console.type = Console
appender.console.name = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} [%t] %-5p %c{1} - %m%n

rootLogger.level = info
rootLogger.appenderRef.console.ref = CONSOLE

logger.inventory.name = com.example.inventory
logger.inventory.level = debug
